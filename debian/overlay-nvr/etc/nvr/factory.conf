# nvr-factory 产测判定阈值。按板型 BOM 与试产数据校准,改完重新构建 rootfs。
# 单项调试时可在 /run/nvr-factory/factory.conf 放同名变量覆盖(重启即失效,不会带进出厂状态)。

# 内存:/proc/meminfo 的 MemTotal 下限(MB)。SATA 板 4GB 实测 MemTotal 3880MB;
# 无 SATA 板同为 8 颗 DDR3,按 4GB 处理,未上板核实
DDR_MIN_MB=3800
# memtester 测试量(MB)与轮数,直接影响单板节拍
DDR_TEST_MB=64
DDR_TEST_LOOPS=1

# eMMC 容量下限(GB,按 10^9 计)。样机 32G 实测约 31.2
EMMC_MIN_GB=28

# 千兆网口:ping 目标,留空取 end0 的默认网关
ETH_PING_TARGET=
ETH_PING_COUNT=20

# SATA 顺序读下限(MB/s),取决于工装盘。2.5 寸 5400 转盘(WD5000BPVT)在 SATA 板上实测 92MB/s;
# 换工装盘要重新实测后再定
SATA_MIN_MBPS=60

# USB3:工装 U 盘必须枚举在 5Gbps 及以上,且顺序读不低于此值(MB/s)
USB3_MIN_MBPS=30
# USB2 口(只有 rv1126b 板测):工装 U 盘 480Mbps 枚举,顺序读下限(MB/s)
USB2_MIN_MBPS=15

# TF 卡、HDMI 显示器是否为工装必配
TF_REQUIRED=1
HDMI_REQUIRED=1

# 温度上限(摄氏度,所有 thermal zone 取最大)
THERMAL_MAX_C=80

# 老化:时长(分钟,必须一次开机内连续跑满)与满载下的温度上限(摄氏度)。
# 温度上限待老化架实测后校准:RK3566 满载约 85C 起降频,此值用于拦散热或供电异常
AGING_MINUTES=120
AGING_THERMAL_MAX_C=95

# 跳过的测试项(空格分隔),仅供调试;出厂固件必须为空
FACTORY_SKIP=
