# RV1126B SATA 板的产测阈值,叠加在 factory.conf 之上(common.sh 按板型 source)。
# 2026-10-21 按原理图建档,板子未到,以下数值全部待实板校准

# 内存:LPDDR3 单颗 32 位(BOM 2026-10-22 只写"LPDDR3,32BIT,178P",未标容量);暂按 1GB 下限,
# 实板看 DDR training 打印后校准
DDR_MIN_MB=900
# eMMC:BOM 为 64G(按 10^9 计约 62GB,留余量)
EMMC_MIN_GB=56

# SATA 走 JMS578 USB3 桥(uas),顺序读上限受桥片与硬盘限制,工装盘实测后再定
SATA_MIN_MBPS=60
# 前面板 USB-A 为 USB2,工装 U 盘顺序读下限
USB2_MIN_MBPS=15

# 本板无 HDMI、无 TF 卡槽(测试项列表里已不含这两项,这里只是保险)
HDMI_REQUIRED=0
TF_REQUIRED=0
